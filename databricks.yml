# Databricks Asset Bundles configuration
# See https://docs.databricks.com/dev-tools/bundles/index.html

bundle:
  name: databricks_check

# Shared notebook job definition
resources:
  jobs:
    sample_etl_job:
      name: "sample-etl-job-${bundle.target}"
      tasks:
        - task_key: run_etl
          notebook_task:
            notebook_path: ./src/notebooks/sample_etl.sql
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"
          existing_cluster_id: "${var.cluster_id}"

# Target-specific overrides
targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: "dev_catalog"
      schema: "etl"
      cluster_id: ""

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: "prod_catalog"
      schema: "etl"
      cluster_id: ""
    run_as:
      service_principal_name: "${var.sp_name}"

variables:
  catalog:
    description: "Unity Catalog name"
  schema:
    description: "Target schema"
  cluster_id:
    description: "Existing cluster ID for the job"
  sp_name:
    description: "Service principal for production"
    default: ""
